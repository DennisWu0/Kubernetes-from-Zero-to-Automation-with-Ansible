---

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory

- name: Download Kubernetes Release.key and convert to keyring
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | \
    sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-archive-keyring.gpg

- name: Add Kubernetes repo using apt_repository
  become: true
  ansible.builtin.shell: |
      echo "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] \
      https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /" | \
      sudo tee /etc/apt/sources.list.d/kubernetes.list
  args:
    creates: /etc/apt/sources.list.d/kubernetes.list

- name: Install kubeadm, kubelet, kubectl
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: present
    update_cache: yes

- name: Hold Kubernetes package versions
  ansible.builtin.shell: "apt-mark hold kubelet kubeadm kubectl"

